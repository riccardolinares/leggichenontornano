name: Verifica

# Tutto quello che deve valere a ogni commit: tipi, test, build del sito e
# l'audit di accessibilità. Una violazione WCAG AA fa fallire la build come una
# qualunque altra regressione — per un progetto civico con utenti potenziali
# nella pubblica amministrazione non c'è una ragione per trattarla diversamente.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: verifica-${{ github.ref }}
  cancel-in-progress: true

env:
  # Il dataset versionato basta per costruire il sito e girare i test: nessun
  # passo di questa verifica scarica il corpus da Normattiva.
  ANTINOMIA_SNAPSHOT: data/snapshot

jobs:
  pacchetti:
    name: Tipi e test dei pacchetti
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Nessun «version:» qui: la versione autorevole è `packageManager` in
      # package.json, ed è più precisa (9.15.0, non 9). Dichiararla in due
      # posti fa fallire l'azione — «Multiple versions of pnpm specified» — e
      # tenerle allineate a mano è un lavoro che prima o poi qualcuno sbaglia.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Genera il client Prisma
        run: pnpm --filter @antinomia/corpus exec prisma generate
      - name: Compila i pacchetti
        run: pnpm run build
      # CONTRIBUTING chiede di passare il formatter prima di committare. Se
      # nessuno lo verifica, la richiesta diventa una trappola: chi la segue si
      # ritrova un diff di sessanta file che non ha scritto lui.
      - name: Formattazione
        run: pnpm exec prettier --check .

      - name: Controllo dei tipi
        run: pnpm run typecheck
      - name: Test unitari
        run: pnpm run test

  sito:
    name: Sito, accessibilità e usabilità
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Nessun «version:» qui: la versione autorevole è `packageManager` in
      # package.json, ed è più precisa (9.15.0, non 9). Dichiararla in due
      # posti fa fallire l'azione — «Multiple versions of pnpm specified» — e
      # tenerle allineate a mano è un lavoro che prima o poi qualcuno sbaglia.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @antinomia/corpus exec prisma generate
      - run: pnpm run build
      - name: Costruisci il sito
        run: pnpm --filter @antinomia/web run build
      - name: Installa Chromium
        run: pnpm --filter @antinomia/web exec playwright install --with-deps chromium
      - name: Playwright — accessibilità WCAG 2.1 AA e usabilità
        run: pnpm --filter @antinomia/web run e2e
      - name: Conserva il rapporto se qualcosa è fallito
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 14

  integrazione:
    name: Ingestione e motore su PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: antinomia
          POSTGRES_PASSWORD: antinomia
          POSTGRES_DB: antinomia
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://antinomia:antinomia@localhost:5432/antinomia
    steps:
      - uses: actions/checkout@v4
      # Nessun «version:» qui: la versione autorevole è `packageManager` in
      # package.json, ed è più precisa (9.15.0, non 9). Dichiararla in due
      # posti fa fallire l'azione — «Multiple versions of pnpm specified» — e
      # tenerle allineate a mano è un lavoro che prima o poi qualcuno sbaglia.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @antinomia/corpus exec prisma db push
      - run: pnpm run build
      - name: Ingerisci le fixture e verifica che il motore giri
        run: |
          node packages/corpus/dist/cli.js ingest packages/akn-parser/test/fixtures \
            --collezione "Fixture di prova"
          node packages/corpus/dist/cli.js stats
          node packages/engine/dist/cli.js run --oggi 2026-01-01
          node packages/engine/dist/cli.js metriche
